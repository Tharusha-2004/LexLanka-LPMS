<div class="container mt-4 mb-5">
  <div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-header bg-primary text-white">
      <h3 class="card-title mb-0">Add New Client</h3>
    </div>
    
    <div class="card-body">

      @if (errorMessage) {
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ errorMessage }}
          <button type="button" class="btn-close" (click)="errorMessage = null" aria-label="Close"></button>
        </div>
      }

      <form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" id="fullName" class="form-control" formControlName="fullName"
                 [class.is-invalid]="clientForm.get('fullName')?.invalid && clientForm.get('fullName')?.touched">
          <div class="invalid-feedback">Full Name is required.</div>
        </div>

        <div class="mb-3">
          <label for="nicNumber" class="form-label">NIC Number <span class="text-danger">*</span></label>
          <input type="text" id="nicNumber" class="form-control" formControlName="nicNumber"
                 [class.is-invalid]="clientForm.get('nicNumber')?.invalid && clientForm.get('nicNumber')?.touched">
          <div class="invalid-feedback">NIC Number is required.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" formControlName="email">
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
          <input type="tel" id="phone" class="form-control" formControlName="phone"
                 [class.is-invalid]="clientForm.get('phone')?.invalid && clientForm.get('phone')?.touched">
          <div class="invalid-feedback">Phone Number is required.</div>
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address <span class="text-danger">*</span></label>
          <textarea id="address" class="form-control" rows="3" formControlName="address"
                    [class.is-invalid]="clientForm.get('address')?.invalid && clientForm.get('address')?.touched"></textarea>
          <div class="invalid-feedback">Address is required.</div>
        </div>

        <div class="mb-4">
          <label for="clientType" class="form-label">Client Type <span class="text-danger">*</span></label>
          <select id="clientType" class="form-select" formControlName="clientType">
            <option value="Individual">Individual</option>
            <option value="Corporate">Corporate</option>
          </select>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
            @if (isSubmitting) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Saving...
            } @else {
              Add Client
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
